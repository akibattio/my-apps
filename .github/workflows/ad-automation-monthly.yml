name: ad-automation monthly export

# 毎月の自動受け渡し：Yahoo!・Microsoft広告の「先月分」を取得 → report-glass の pipeline/ に出力 → commit/push。
# push すると Render が自動デプロイし、起動時に pipeline/yahoo・microsoft を /var/data へ取り込む。
# 旧：Mac の launchd（com.sofcom.adops.monthly → scripts/monthly_adreport_export.sh）。誰のMacにも依存しないよう移管（2026-11-08）。
# 読み取りのみ（広告媒体へは書き込まない）。秘密は GitHub Secrets、report-glass への push は書き込み専用の deploy key。

on:
  schedule:
    - cron: "0 0 3 * *"  # 毎月3日 09:00 JST（GitHub の schedule は数時間遅れることがある）
  workflow_dispatch:
    inputs:
      month:
        description: "対象月 YYYY-MM（空なら先月）"
        type: string
        default: ""
      push:
        description: "report-glass へ commit/push する（オフなら差分の確認だけ）"
        type: boolean
        default: false
      overwrite:
        description: "既にある月のファイルも上書きする（手で補ったCSV分が消えるので通常オフ）"
        type: boolean
        default: false

permissions:
  contents: read

# 外部のプルリクエストでは起動しない（きっかけは schedule と workflow_dispatch だけ）。
# 外部のアクションはコミット番号で固定。秘密はそれを使うステップにだけ渡す。入力値はシェルに直接埋め込まず環境変数で渡し、形を確かめてから使う。
concurrency:
  group: ad-automation-monthly
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          path: my-apps
          sparse-checkout: ad-automation

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          repository: akibattio/report-glass
          ref: master
          path: report-glass
          ssh-key: ${{ secrets.REPORT_GLASS_DEPLOY_KEY }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: 依存インストール
        run: pip install -r my-apps/ad-automation/requirements.txt

      - name: 先月分を書き出し（読み取りのみ）
        working-directory: my-apps/ad-automation
        env:
          MONTH_INPUT: ${{ inputs.month }}
          YAHOO_ADS_CLIENT_ID: ${{ secrets.YAHOO_ADS_CLIENT_ID }}
          YAHOO_ADS_CLIENT_SECRET: ${{ secrets.YAHOO_ADS_CLIENT_SECRET }}
          YAHOO_ADS_REFRESH_TOKEN: ${{ secrets.YAHOO_ADS_REFRESH_TOKEN }}
          YAHOO_ADS_BASE_ACCOUNT_ID: ${{ secrets.YAHOO_ADS_BASE_ACCOUNT_ID }}
          YAHOO_ADS_API_VERSION: ${{ secrets.YAHOO_ADS_API_VERSION }}
          MS_ADS_DEVELOPER_TOKEN: ${{ secrets.MS_ADS_DEVELOPER_TOKEN }}
          MS_ADS_CUSTOMER_ID: ${{ secrets.MS_ADS_CUSTOMER_ID }}
          MS_ADS_ACCOUNT_ID: ${{ secrets.MS_ADS_ACCOUNT_ID }}
          MS_ADS_ENVIRONMENT: ${{ secrets.MS_ADS_ENVIRONMENT }}
          MS_ADS_GOOGLE_CLIENT_ID: ${{ secrets.MS_ADS_GOOGLE_CLIENT_ID }}
          MS_ADS_GOOGLE_CLIENT_SECRET: ${{ secrets.MS_ADS_GOOGLE_CLIENT_SECRET }}
          MS_ADS_GOOGLE_REFRESH_TOKEN: ${{ secrets.MS_ADS_GOOGLE_REFRESH_TOKEN }}
          MS_ADS_CLIENT_ID: ${{ secrets.MS_ADS_CLIENT_ID }}
          MS_ADS_CLIENT_SECRET: ${{ secrets.MS_ADS_CLIENT_SECRET }}
          MS_ADS_REFRESH_TOKEN: ${{ secrets.MS_ADS_REFRESH_TOKEN }}
          MS_ADS_REDIRECT_URI: ${{ secrets.MS_ADS_REDIRECT_URI }}
          # 担当者がコンソールで追加した Yahoo!/Microsoft アカウント（KV mediaAccounts）を wrangler で読む
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 記録（公開）に出るのは件数・成否だけ（scripts/adops_log.py）。識別名や数字は出さない
        run: |
          MONTH="$MONTH_INPUT"
          [ -n "$MONTH" ] || MONTH=$(TZ=Asia/Tokyo date -d "$(TZ=Asia/Tokyo date +%Y-%m-01) -1 month" +%Y-%m)
          if ! printf '%s' "$MONTH" | grep -Eq '^20[0-9]{2}-(0[1-9]|1[0-2])$'; then
            echo "対象月は YYYY-MM で指定してください"; exit 1
          fi
          echo "MONTH=$MONTH" >> "$GITHUB_ENV"
          echo "対象月: $MONTH"
          RG="$GITHUB_WORKSPACE/report-glass"
          # 書き出しの記録は確かめの段（次）で数えるため、画面にも出しつつ一時ファイルにも残す（中身は件数・成否だけ）
          set +e
          AD_REPORT_DIR="$RG/pipeline/yahoo" python3 scripts/export_yahoo_for_adreport.py "$MONTH" 2>&1 | tee "$RUNNER_TEMP/export-yahoo.log"
          echo "RC_YAHOO=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          AD_REPORT_DIR="$RG/pipeline/microsoft" python3 scripts/export_microsoft_for_adreport.py "$MONTH" 2>&1 | tee "$RUNNER_TEMP/export-microsoft.log"
          echo "RC_MICROSOFT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          set -e
          # 対応表（ファイル＋コンソールで足した分）で slug の付いている社の数。書き出しと同じ読み方（media_accounts.load）
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from media_accounts import load
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for media in ("yahoo", "microsoft"):
                  n = len({e["slug"] for e in load(media) if e.get("slug") and e.get("accountId")})
                  f.write(f"EXPECT_{media.upper()}={n}\n")
          PY

      # 取り込みの確かめ（2026-11-20 RG-7）。媒体ごとに、次のどれかに当たったら「外れ」とし、その媒体の今月分は report-glass に入れない。
      #   書き出しが 0 以外で終わった／「取得失敗」の行がある／「出力」と「実績なしで省略」の合計が対応表の社数と合わない
      # 取得失敗でもファイルが書き出されることがある（一部の項目が欠けたまま）ので、ファイルの有無では判定しない。
      # 記録に出すのは件数と、どの段で外れたかだけ（公開リポジトリ。社名・slug・数字・アカウントの番号は出さない）。
      - name: 取り込みの確かめ
        working-directory: report-glass
        run: |
          BAD=""
          for MEDIA in yahoo microsoft; do
            UP=$(echo "$MEDIA" | tr a-z A-Z)
            LOG="$RUNNER_TEMP/export-$MEDIA.log"
            RC_VAR="RC_$UP"; EX_VAR="EXPECT_$UP"
            RC="${!RC_VAR:-1}"; EXPECT="${!EX_VAR:-}"
            OUT=$(grep -c "件目を出力" "$LOG" 2>/dev/null || true)
            SKIP=$(grep -c "出力スキップ" "$LOG" 2>/dev/null || true)
            FAIL=$(grep -c "取得失敗" "$LOG" 2>/dev/null || true)
            NOTOUT=$(grep -c "出力しない" "$LOG" 2>/dev/null || true)
            WHY=""
            [ "$RC" = "0" ] || WHY="$WHY 書き出しの終了コード$RC"
            [ "${FAIL:-0}" = "0" ] || WHY="$WHY 取得失敗${FAIL}行"
            [ "${NOTOUT:-0}" = "0" ] || WHY="$WHY 出力しない${NOTOUT}件"
            if [ -z "$EXPECT" ]; then WHY="$WHY 対応表の社数が読めない"
            elif [ $(( ${OUT:-0} + ${SKIP:-0} )) -ne "$EXPECT" ]; then WHY="$WHY 件数が合わない（対応表${EXPECT}社・出力${OUT:-0}・省略${SKIP:-0}）"; fi
            echo "$MEDIA: 対応表${EXPECT:-?}社・出力${OUT:-0}・実績なしで省略${SKIP:-0}・取得失敗${FAIL:-0}行 → ${WHY:-OK}"
            if [ -n "$WHY" ]; then
              BAD="$BAD $MEDIA"
              # この媒体の今月分は入れない：新しく書いたファイルは消し、既にあったファイルは元に戻す
              git ls-files --others --exclude-standard -- "pipeline/$MEDIA/*-$MONTH.json" | xargs -r rm -f
              git checkout -- "pipeline/$MEDIA" 2>/dev/null || true
            fi
          done
          echo "CHECK_BAD=${BAD# }" >> "$GITHUB_ENV"

      - name: report-glass へ commit/push
        working-directory: report-glass
        env:
          OVERWRITE: ${{ inputs.overwrite }}
          DO_PUSH: ${{ github.event_name == 'schedule' || inputs.push }}
        run: |
          # 既にあるファイルは戻す＝新しい月だけ追加（手で補った分＝CSV から足した項目などを消さない）
          if [ "$OVERWRITE" != "true" ]; then
            echo "上書きしない既存ファイル: $(git diff --name-only -- pipeline/yahoo pipeline/microsoft | wc -l | tr -d ' ')件"
            git checkout -- pipeline/yahoo pipeline/microsoft
          fi
          # 媒体ごとに足す（確かめで外した媒体の今月分が無くても、もう片方は入るように）
          for d in yahoo microsoft; do git add -- pipeline/"$d"/*-"$MONTH".json 2>/dev/null || true; done
          if git diff --cached --quiet; then
            echo "変更なし（push不要）"; exit 0
          fi
          # ファイル名には識別名が入るので、記録には件数だけ出す
          echo "追加・更新: $(git diff --cached --name-only | wc -l | tr -d ' ')ファイル"
          git config user.name "ad-automation (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Yahoo/Microsoft ${MONTH} を自動取得（my-apps ad-automation-monthly）" -- pipeline/yahoo pipeline/microsoft
          if [ "$DO_PUSH" = "true" ]; then
            git push -q origin master && echo "push 完了 → Render が自動デプロイ"
          else
            # 手動の確認実行：書き込み権限だけ確かめて、実際には送らない
            git push --dry-run -q origin master && echo "（確認のみ・push していません）"
          fi

      # 外れた媒体があれば、ここで失敗にする（GitHub の失敗メールが届く）。Chat へは社内の決まった宛先（GOOGLE_CHAT_WEBHOOK_URL）だけに送る。
      # 前の段で止まった（取得や push の失敗）ときも、ここで知らせる。文には件数と段の名前だけを入れる。
      - name: 外れたら知らせる
        if: always()
        env:
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ] && [ -z "${CHECK_BAD:-}" ]; then
            echo "取り込みの確かめ: すべて OK"; exit 0
          fi
          WHAT="${CHECK_BAD:+外れた媒体: $CHECK_BAD（この媒体の今月分は report-glass に入れていません）}"
          [ "$JOB_STATUS" = "success" ] || WHAT="途中の段で止まりました${WHAT:+／$WHAT}"
          MSG="REPORT GLASS の月次の取り込み（${MONTH:-月不明}）で問題がありました。${WHAT}。記録: $RUN_URL"
          if [ -n "$GOOGLE_CHAT_WEBHOOK_URL" ]; then
            python3 -c 'import json,os,sys,urllib.request as u; r=u.Request(os.environ["GOOGLE_CHAT_WEBHOOK_URL"], data=json.dumps({"text": sys.argv[1]}).encode(), headers={"Content-Type": "application/json; charset=UTF-8"}); u.urlopen(r, timeout=20)' "$MSG" \
              && echo "Chat へ知らせました" || echo "Chat への通知に失敗しました"
          else
            echo "Chat の宛先が未設定のため、GitHub の失敗メールだけで知らせます"
          fi
          echo "$MSG"
          exit 1
