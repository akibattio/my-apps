name: ad-automation daily

# 広告データの取得 → 監視 → Cloudflare Pages（sofcom-adops）へデプロイ。誰のMacにも依存しない本番の更新経路。
# 秘密情報は GitHub Secrets（リポジトリには入れない・CLAUDE.md §8）。書き込み系は一切呼ばない（読み取りのみ）。
# ※GitHub の定時実行は3〜7時間遅れることがある（2026-10〜11 実測）。朝の通知は workflow_dispatch(notify=true) でも起動できる。

on:
  schedule:
    - cron: "30 23 * * *"  # 08:30 JST（朝の定期）
    - cron: "0 3 * * *"    # 12:00 JST（日中の再取得＝急変を早く検知）
    - cron: "0 7 * * *"    # 16:00 JST（夕方の再取得）
  workflow_dispatch:
    inputs:
      notify:
        description: "監視結果を Google Chat へ送る"
        type: boolean
        default: false
  # ad-automation の変更を main に push したら自動で再取得＆デプロイ（コンソール改修を即反映）
  push:
    branches: [main]
    paths:
      - "ad-automation/**"
      - ".github/workflows/ad-automation-daily.yml"

permissions:
  contents: read
  actions: write  # 期間集計の蓄積（actions/cache）の保存

concurrency:
  group: ad-automation-daily
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ad-automation
    env:
      GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
      GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
      GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
      GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
      GOOGLE_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_LOGIN_CUSTOMER_ID }}
      SOFCOM_META_SYSTEM_USER_TOKEN: ${{ secrets.SOFCOM_META_SYSTEM_USER_TOKEN }}
      # LINEヤフー広告（未登録なら空→scriptsが自動スキップ）
      YAHOO_ADS_CLIENT_ID: ${{ secrets.YAHOO_ADS_CLIENT_ID }}
      YAHOO_ADS_CLIENT_SECRET: ${{ secrets.YAHOO_ADS_CLIENT_SECRET }}
      YAHOO_ADS_REFRESH_TOKEN: ${{ secrets.YAHOO_ADS_REFRESH_TOKEN }}
      YAHOO_ADS_BASE_ACCOUNT_ID: ${{ secrets.YAHOO_ADS_BASE_ACCOUNT_ID }}
      YAHOO_ADS_API_VERSION: ${{ secrets.YAHOO_ADS_API_VERSION }}
      # Microsoft広告（未登録なら空→ms_enabled() が False でスキップ）
      MS_ADS_DEVELOPER_TOKEN: ${{ secrets.MS_ADS_DEVELOPER_TOKEN }}
      MS_ADS_CUSTOMER_ID: ${{ secrets.MS_ADS_CUSTOMER_ID }}
      MS_ADS_ACCOUNT_ID: ${{ secrets.MS_ADS_ACCOUNT_ID }}
      MS_ADS_ENVIRONMENT: ${{ secrets.MS_ADS_ENVIRONMENT }}
      MS_ADS_GOOGLE_CLIENT_ID: ${{ secrets.MS_ADS_GOOGLE_CLIENT_ID }}
      MS_ADS_GOOGLE_CLIENT_SECRET: ${{ secrets.MS_ADS_GOOGLE_CLIENT_SECRET }}
      MS_ADS_GOOGLE_REFRESH_TOKEN: ${{ secrets.MS_ADS_GOOGLE_REFRESH_TOKEN }}
      MS_ADS_CLIENT_ID: ${{ secrets.MS_ADS_CLIENT_ID }}
      MS_ADS_CLIENT_SECRET: ${{ secrets.MS_ADS_CLIENT_SECRET }}
      MS_ADS_REFRESH_TOKEN: ${{ secrets.MS_ADS_REFRESH_TOKEN }}
      MS_ADS_REDIRECT_URI: ${{ secrets.MS_ADS_REDIRECT_URI }}
      # 担当者がコンソールで追加した Yahoo!/Microsoft アカウント（KV mediaAccounts）を wrangler で読む
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
      # 通知は「Webhookが登録済み かつ (朝8:30の定期 または notify=true の手動/外部起動)」のときだけ Google Chat へ。
      # push(コード修正の反映)や昼12:00/夕16:00の再取得では送らない（通知は1日1回・ノイズ回避）。
      NOTIFY_CHANNEL: ${{ (secrets.GOOGLE_CHAT_WEBHOOK_URL != '' && ((github.event_name == 'workflow_dispatch' && inputs.notify) || (github.event_name == 'schedule' && github.event.schedule == '30 23 * * *'))) && 'googlechat' || 'none' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存インストール
        run: pip install -r requirements.txt

      # 期間集計（過去13か月の日次）は前回までの蓄積に直近40日を上書きする方式。実行をまたいで cache に持つ。
      # cache が無い（初回・7日以上未実行で消えた）ときは fetch_daily_history.py が13か月分を取り直す。
      - name: 期間集計の蓄積を復元
        uses: actions/cache/restore@v4
        with:
          path: ad-automation/data/history.json
          key: adops-history-${{ github.run_id }}
          restore-keys: adops-history-

      - name: 取得 → 日次時系列 → 検索診断 → 監視（読み取りのみ）
        run: |
          python3 scripts/build_console_data.py
          python3 scripts/fetch_daily_series.py
          # 過去13か月の日次を蓄積（コンソールの「期間集計」）→ console/history.json
          python3 scripts/fetch_daily_history.py || true
          python3 scripts/fetch_search_diagnostics.py
          # クリエイティブ別の週次推移(Google/Meta・直近8週＋今週)→ console/creatives_weekly.json
          python3 scripts/fetch_creative_weekly.py || true
          # 月次時系列(最大14ヶ月・前年同月比/長期トレンド用)→ console/monthly.json
          python3 scripts/fetch_monthly_series.py || true
          # 月次キーワード別(直近4ヶ月・レポートタブのキーワード分析用)→ console/keywords.json
          python3 scripts/fetch_keywords_monthly.py || true
          # レポート内訳(デバイス/曜日/時間/媒体タイプ/キャンペーン/検索クエリ・直近3ヶ月)→ console/breakdowns.json
          python3 scripts/fetch_report_breakdowns.py || true
          # 監査（ads-google観点の機械チェック）→ console/audit.json（クライアント詳細で表示）
          python3 scripts/build_audits.py || true
          # 提案の下書き生成（監査・検索診断から）→ console/data.json の proposals（承認キュー）
          python3 scripts/build_proposals.py || true
          # 監視＋通知（NOTIFY_CHANNEL=none のときは送信スキップ＝Webhook未登録/朝以外は自動でnone）
          python3 scripts/monitor.py --send || true
          # 週次/月次ビュー用に日次時系列を配信ディレクトリへ複製
          cp data/daily.json console/daily.json 2>/dev/null || true

      - name: 期間集計の蓄積を保存
        if: always() && hashFiles('ad-automation/data/history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: ad-automation/data/history.json
          key: adops-history-${{ github.run_id }}

      - name: Cloudflare Pages へデプロイ（console/ を配信）
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ad-automation
          command: pages deploy console --project-name=sofcom-adops --branch=main
