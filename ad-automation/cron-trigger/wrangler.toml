# 定時起動専用の Worker（中身は worker.js）。デプロイ：ad-automation/cron-trigger で npx wrangler@4 deploy
# 鍵の登録：npx wrangler@4 secret put GITHUB_TOKEN（入力は画面に出ない）
name = "sofcom-adops-cron"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
# UTC。08:30 / 12:00 / 16:00 JST（08:30 の回だけ Google Chat 通知つき）
crons = ["30 23 * * *", "0 3 * * *", "0 7 * * *"]
